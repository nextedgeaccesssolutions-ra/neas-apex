name: Format package metadata

on:
  push:
    branches:
      - fix/docker-validation-tailwind-postcss

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docker-validation-tailwind-postcss
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format package.json
        run: npx --yes prettier@3 --write package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Formatting already clean."
          else
            git commit -m "style: format package metadata"
            git push
          fi
