name: Temporary GIIE formatting pass

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/giie-ph-trend-engine' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: \${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Format GIIE trend files
        run: npx --yes prettier@3 --write docs/NEAS-GIIE-PHILIPPINES-TREND-ENGINE.md lib/giie-ph-trends.ts scripts/giie-ph-trend-collector.ts tests/neas-giie-ph-trends.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEAS-GIIE-PHILIPPINES-TREND-ENGINE.md lib/giie-ph-trends.ts scripts/giie-ph-trend-collector.ts tests/neas-giie-ph-trends.test.ts
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
          else
            git commit -m "style(giie): apply Prettier formatting"
            git push origin HEAD:\${{ github.event.pull_request.head.ref }}
          fi
