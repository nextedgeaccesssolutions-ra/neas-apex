name: NEAS dependency review (human approval required)

# Dependency updates are never auto-merged. Every update requires an
# independent human reviewer and the normal six-gate release process.

on:
  pull_request_target:
    types: [opened, reopened]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-independent-review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require independent human review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "NEAS release policy: dependency updates are not auto-merged. Assign an independent human reviewer and verify the complete CI, TypeScript, dependency/security, production-build and Vercel preview gates, plus repository branch protection, before any manual merge."
