name: NEAS APEX Recovery Validation

on:
  push:
    branches:
      - recovery/pr9-react-hooks-lint-2026-11-22

permissions:
  contents: read

concurrency:
  group: neas-apex-recovery-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, tests, audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
