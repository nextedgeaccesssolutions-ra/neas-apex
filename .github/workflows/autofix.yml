name: NEAS APEX auto-fix and health watch

# Read-only formatting checks on PRs, blocking verification gates (tests,
# typecheck, build), and a scheduled production probe that files/updates one
# rolling issue with evidence.
#
# What this does NOT do: rewrite application logic, touch secrets, promote
# deployments, or mark agents active. Those stay human-gated.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Every 30 minutes, production probe (runs on default branch).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neas-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Formatting check (read-only PR validation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Changed files
        id: changed
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 },
            );
            const names = files
              .map((f) => f.filename)
              .filter((n) => /\.(ts|tsx|js|jsx|json|css|md)$/.test(n));
            core.setOutput('files_json', JSON.stringify(names));
            core.setOutput('count', String(names.length));

      - name: Prettier check (read-only; no PR-branch writes)
        if: steps.changed.outputs.count != '0'
        env:
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.files_json }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const files = JSON.parse(process.env.CHANGED_FILES_JSON || '[]');
          if (!Array.isArray(files) || files.some((file) => typeof file !== 'string' || !file)) {
            throw new Error('Invalid changed-file list');
          }
          if (files.length === 0) process.exit(0);
          const result = spawnSync('npx', ['--yes', 'prettier@3', '--check', '--', ...files], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE

  verify:
    name: Tests, typecheck, build (blocking gates)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security regression tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

  probe-production:
    name: Production smoke probe (auto-detect, auto-report)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      PROD_URL: "https://neas-apex-nextedgeaccesssolutions-neas.vercel.app"
      WORKER_PATH: "/api/internal/workforce/worker"
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Probe production endpoints
        id: probe
        run: |
          set -u
          FAILS=""
          note() { echo "$1"; FAILS="${FAILS}${1}; "; }
          WALLED="no"
          AUTH=()
          if [ -n "${VERCEL_PROTECTION_BYPASS:-}" ]; then AUTH=(-H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}"); fi

          wall_check() { grep -q "Vercel Authentication" "$1" 2>/dev/null; }

          # 1. Worker route must exist and enforce auth: no secret -> 401 (NOT 404).
          WCODE=$(curl -s "${AUTH[@]}" -o /tmp/worker.json -w "%{http_code}" "${PROD_URL}${WORKER_PATH}" || echo "000")
          WBODY=$(head -c 300 /tmp/worker.json 2>/dev/null || true)
          echo "worker_noauth_status=${WCODE} body=${WBODY}"
          if wall_check /tmp/worker.json; then
            note "INFO deployment-protection wall on worker route (add VERCEL_PROTECTION_BYPASS secret for authed probing)"
            WALLED="yes"
          elif [ "${WCODE}" != "401" ]; then note "FAIL worker-noauth expected=401 got=${WCODE} body=${WBODY}"; fi

          # 2. Health route (present after fix deploy): expect 200 {ok:true}.
          HCODE=$(curl -s "${AUTH[@]}" -o /tmp/health.json -w "%{http_code}" "${PROD_URL}/api/health" || echo "000")
          HBODY=$(head -c 300 /tmp/health.json 2>/dev/null || true)
          echo "health_status=${HCODE} body=${HBODY}"
          if wall_check /tmp/health.json; then
            note "INFO deployment-protection wall on health route (add VERCEL_PROTECTION_BYPASS secret for authed probing)"
            WALLED="yes"
          elif [ "${HCODE}" != "200" ]; then note "FAIL health expected=200 got=${HCODE} body=${HBODY}"; fi

          # 3. Homepage must server-render its accessible voice widget landmark.
          # The ElevenLabs custom element is mounted after client hydration.
          # Skipped behind the wall: the login page carries no app markup.
          if [ "${WALLED}" = "yes" ]; then
            note "INFO homepage check skipped behind deployment-protection wall"
          elif ! curl -fsSL "${AUTH[@]}" "${PROD_URL}/" | grep -q 'aria-label="NEAS AI Core voice conversation"'; then
            note "FAIL homepage missing server-rendered NEAS voice widget landmark"
          fi

          echo "summary=${FAILS:-all-green}" >> "$GITHUB_OUTPUT"
          if echo "${FAILS}" | grep -q "FAIL"; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: File or update rolling watch issue
        if: steps.probe.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          TITLE="[auto-watch] NEAS production probe failures"
          BODY="Automated production probe failed at $(date -u +%FT%TZ).
          - Prod: ${PROD_URL}
          - Evidence: ${SUMMARY}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Next: do NOT mark agents active. Inspect worker logs, lease table, and deployment alias before any promotion."
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "$GITHUB_REPOSITORY" --body "${BODY}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${TITLE}" --body "${BODY}" --label "automation"
          fi
