name: NEAS APEX Docker Image Validation

on:
  pull_request:
    branches:
      - main
      - feature/giie-cms-publisher-bridge
  push:
    branches:
      - feature/neas-docker-runtime

permissions:
  contents: read

concurrency:
  group: neas-apex-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build image without pushing
        run: docker build --pull --tag neas-apex:pr-validation .
