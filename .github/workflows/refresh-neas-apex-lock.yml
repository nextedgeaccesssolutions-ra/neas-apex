name: Refresh NEAS APEX recovery lockfile

on:
  push:
    branches:
      - fix/neas-engineering-ai-recovery-2026-11
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/fix/neas-engineering-ai-recovery-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Apply non-breaking security updates
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile to recovery branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: refresh recovery lockfile"
            git push origin HEAD:refs/heads/fix/neas-engineering-ai-recovery-2026-11
          fi
