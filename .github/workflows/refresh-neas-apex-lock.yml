name: One-time NEAS APEX lockfile refresh

on:
  push:
    branches:
      - fix/neas-apex-integrated-runtime-2026-11-22
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/neas-apex-integrated-runtime-2026-11-22'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/fix/neas-apex-integrated-runtime-2026-11-22
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible dependency security fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Commit lockfile and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-neas-apex-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were produced."
          else
            git commit -m "chore: refresh lint and typecheck dependency lockfile"
            git push origin HEAD:refs/heads/fix/neas-apex-integrated-runtime-2026-11-22
          fi
